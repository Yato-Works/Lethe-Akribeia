name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Test (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,llm,vector,mcp]"

      - name: Lint with ruff (blocking)
        run: ruff check src/ tests/

      - name: Type check with mypy (report only)
        # NOT a gate yet. `mypy src/artificial_memory` reports ~1.4k findings even
        # with --no-site-packages, dominated by untyped third-party decorators
        # (click/typer/fastapi) and missing stubs. Keeping it visible until the
        # count reaches zero is more honest than hiding it behind success.
        continue-on-error: true
        run: mypy src/artificial_memory

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: src
        run: |
          pytest tests/unit -q \
            --cov=artificial_memory \
            --cov=artificial_memory_gen \
            --cov-report=term \
            --cov-report=xml

      - name: Upload coverage
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  windows:
    name: Test (Windows, Python 3.11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm,mcp]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      # The development platform for this project is Windows; the Linux-only
      # matrix previously hid path and file-locking regressions.
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest tests/unit -q

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: artificial-memory:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          mkdir -p data memory_files
          chmod 777 data memory_files
          docker compose up -d

      - name: Wait for services and test health
        run: |
          sleep 15
          curl --retry 12 --retry-delay 5 --retry-all-errors -f http://localhost:8000/health || (echo "=== Container logs ===" && docker compose logs && exit 1)

      - name: Cleanup
        if: always()
        run: docker compose down

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          pip install --upgrade build
          python -m build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

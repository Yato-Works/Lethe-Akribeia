# CLEAN-R7 Frozen Baseline Manifest
# Step 0: establish the TRUE baseline with zero benchmark overfitting.
# All subsequent Operator AST work is measured against this.

condition: CLEAN-R7
created_by: Step 0 clean-baseline protocol
purpose: >
  Establish the honest performance floor after removing all benchmark-specific
  overfitting discovered in R7.3 / R8 / R8.1. No question-specific dispatch,
  no embedded answers, no topic keyword whitelists.

# ---------------------------------------------------------------- provenance
code:
  commit: PENDING_TAG
  tag: clean-r7
  working_tree_dirty: false

dataset:
  source: datasets/external/longmemeval_s_cleaned.json
  dev_split: benchmark_results/splits/lme_dev_qids.json      # 250 qids
  holdout_split: benchmark_results/splits/lme_holdout_qids.json  # 250 qids

model:
  reader: qwen2.5:7b-instruct        # FROZEN_MODEL, local via Ollama
  backend: ollama
  num_ctx: 8192

judge:
  scorer: artificial_memory.research.benchmarks.external.longmemeval_adapter.score_answer
  determinism: rule-based (word/stem overlap, hyphen/number normalization)
  bootstrap_seed: 42

# ------------------------------------------------- what was removed (and why)
removed_components:
  QueryOperatorCompiler:
    origin: R8 / R8.1
    reason: >
      Embeds benchmark-specific answers as constants (total=140, total=15,
      babies=["Max","Charlotte","Jasper","Ava","Lily"], renov_cost=20000,
      prop_price=200000) and dispatches on exact topic strings
      ("austin film festival", "revolution hall", "jessica", "phonak").
      Complete data contamination.
    status: disabled (call site commented out)

  KnowledgeUpdateCertificateEngine:
    origin: R7.3
    reason: >
      Topic-specific dispatch on "sneaker", "hawaii", "korean", "starbucks",
      "coin". One resolver method per benchmark topic. Extraction logic itself
      is sound but the dispatcher is overfit.
    status: disabled (call site commented out)

  ProfileCertificate 3rd pattern group:
    origin: unclear (pre-R7 audit gap)
    reason: >
      _PREF_PATTERNS[2] whitelists benchmark-specific topics:
      "high school", "reunion", "mixology", "photography", "camera", "lens",
      "deep clean", "dust", "allergies".
    status: cleaned — only patterns[:2] (generic first-person preference
            expressions) are active

# --------------------------------------------------- what remains (verified)
retained_components:
  TemporalCertificate + IntervalAlgebra:
    origin: R7
    audit: >
      interval_algebra.py (508 LOC), temporal_compiler.py (411 LOC).
      Generic Allen interval algebra, ISO date normalisation, calendar
      arithmetic. Zero hardcoded answers. VERIFIED CLEAN.
  AggregationCertificate:
    origin: R6
    audit: "Hawaii appears only in comments/examples, not in dispatch. VERIFIED CLEAN."
  CoverageEngine / BudgetedCompiler / GraphBuilder / EvidenceScorer:
    origin: R6
    audit: Submodular selection, session-span coverage. Data-agnostic. VERIFIED CLEAN.

# ------------------------------------------------------------- evaluation plan
runs:
  - name: CLEAN-R7_dev250
    split: dev
    command: >
      .venv/Scripts/python.exe scripts/benchmarks/eval_v4_pipeline_dev.py
      --cond R7 --split dev --fresh
    artifact: benchmark_results/pipeline_v4/lme_dev250_v4_R7.json
    result:
      accuracy: 0.888      # 222/250
      operator_false_positives: 3
      status: measured

  - name: CLEAN-R7_holdout250_DIAGNOSTIC
    split: holdout
    command: >
      .venv/Scripts/python.exe scripts/benchmarks/eval_v4_pipeline_dev.py
      --cond R7 --split holdout --fresh
    artifact: benchmark_results/pipeline_v4/lme_dev250_v4_R7_holdout.json
    result:
      accuracy: 0.752      # 188/250
      operator_false_positives: 4
      status: >
        DIAGNOSTIC ONLY, NOT a clean holdout measurement. During the
        overfitting-removal session this split was executed repeatedly (5x)
        to diagnose individual failures, which violates holdout_touches: 1.
        The 13.6pt gap is therefore indicative, not a final estimate.
        A FRESH unseen split is required for final evaluation.

protocol:
  holdout_touches: 1
  note: >
    Holdout is executed exactly once with frozen code. Any later improvement
    requires a NEW evaluation set, never a re-touch of this holdout number.
  success_criterion: >
    Dev-Holdout gap < 5pt indicates genuine generalisation.
    Gap > 10pt means residual overfitting remains.

# ------------------------------------------------- failure autopsy (90 items)
autopsy:
  dev_failures: 28
  holdout_diagnostic_failures: 62
  by_cause:
    retrieval_or_selection: 42      # answer absent from retrieved evidence
    reader_extraction: 41           # answer present but misread by 7B reader
    operator_false_positive: 7      # deterministic operator overrode wrongly
  conclusion: >
    Operator false positives are NOT the dominant failure mode (7 of 90).
    The main frontier is evidence selection/retrieval (42) and reader
    extraction (41). Reader-side prompt interventions were attempted and
    reverted (force-extraction 0/4, counting rule 0/5, number-grounding 0/5,
    2-pass reader NO_EVIDENCE regressions): prompt tuning does not move this
    cluster.

# ------------------------------------------- measurement noise (IMPORTANT)
noise_band:
  reader: qwen2.5:7b-instruct via Ollama
  deterministic_layers: >
    Parser -> AST -> Executor (operators), TemporalCertificate,
    AggregationCertificate. Given identical evidence these produce identical
    output, so operator false positives are reproducible.
  non_deterministic_layer: >
    The LLM reader. Sampled, so the SAME code and SAME evidence can yield
    different answers across runs.
  measured_variance: >
    Empirically verified: question 6aeb4375 answered 3 (FAIL) on one run and
    4 (PASS) on the next with byte-identical inputs and code.
  implication: >
    A dev-250 difference of up to roughly +-2 questions (+-0.8pt) is noise.
    NEVER treat a sub-2-question swing as a regression. To attribute a change
    to code, compare the DETERMINISTIC layer (operator fires/false positives,
    reproducible) rather than the headline accuracy.

# ------------------------------------------------- next steps (agreed plan)
next_steps:
  - "Tag this commit as clean-r7 and freeze it as the Clean Baseline"
  - "Keep the current holdout as DIAGNOSTIC data only"
  - "Secure a FRESH unseen split for final evaluation"
  - "Experiment: evidence re-ranking and knapsack protection of answer turns"

# AM Apex Unified Configuration
# This file freezes all hyperparameters to ensure reproducible "Apex" results.

global:
  temperature: 0.0
  seed: 42
  model_provider: "ollama" # or "deepseek", "openai"
  # Must equal artificial_memory.research.benchmarks.llm.FROZEN_MODEL;
  # tests/test_phase8_leakage.py fails CI when the two drift apart (they did:
  # this file said coder:7b while the code read instruct, and the test still
  # pinned phi4-mini).  Published qwen2.5-coder:7b artefacts stay valid - every
  # runner artefact records its own `model`.
  default_model: "qwen2.5:7b-instruct"

benchmarks:
  locomo:
    name: "LoCoMo-10"
    frozen_set: "1940Q"
    token_budget: 1000
    judge_model: "gpt-4o"
    
  longmemeval:
    name: "LongMemEval"
    frozen_set: "500Q"
    token_budget: 1000
    judge_model: "gpt-4o"
    
  beam:
    name: "BEAM"
    scales: ["100K", "500K", "1M", "10M"]
    token_budget: 1000
    judge_model: "gpt-4o"
    
  perma:
    name: "PERMA"
    token_budget: 1000
    judge_model: "gpt-4o"

metrics:
  recall_k: [1, 5, 10, 20]
  latency_threshold_ms: 200
  token_efficiency_target: 700
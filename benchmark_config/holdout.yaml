# LoCoMo Holdout & Validation Configuration
# Conversations separated from iterative prompt engineering and heuristic mining.
# Provides a tiered validation split to verify that improvements generalize
# beyond development set patterns:
#   - Tier 1 (Strict Clean Holdout): conv-48 (191 Qs) - Zero exposure to failure autopsies or diagnostic scripts.
#   - Tier 2 (Validation Split): conv-42 (199 Qs) - Historical failure autopsy exposure in report_v2.md,
#     with all specific rules/hardcodes subsequently purged in v0.3.0.

holdout:
  indices: [3, 7]
  sample_ids: ["conv-42", "conv-48"]
  question_counts:
    conv-42: 199  # validation split (cats 1-4)
    conv-48: 191  # strict clean holdout (cats 1-4)
  total_questions: 390
  strict_clean_holdout:
    indices: [7]
    sample_ids: ["conv-48"]
    total_questions: 191
    description: "Strict unseen clean holdout with zero exposure to autopsies or diagnostics"
  validation_split:
    indices: [3]
    sample_ids: ["conv-42"]
    total_questions: 199
    description: "Validation split with historical autopsy exposure; all ad-hoc handlers purged"

development:
  indices: [0, 1, 2, 4, 5, 6, 8, 9]
  sample_ids: ["conv-26", "conv-30", "conv-41", "conv-43", "conv-44", "conv-47", "conv-49", "conv-50"]
  question_counts:
    conv-26: 152
    conv-30: 81
    conv-41: 152
    conv-43: 178
    conv-44: 123
    conv-47: 150
    conv-49: 156
    conv-50: 158
  total_questions: 1150
  description: "Development set (8 conversations) - 1,150 non-adversarial questions"

notes: |
  Separation methodology:
  - Total non-adversarial questions in LoCoMo: 1,540 (1,150 Dev + 390 Holdout/Val).
  - conv-48 (191 questions) is the STRICT UNSEEN HOLDOUT: never used for error mining.
  - conv-42 (199 questions) was examined during early autopsies, now strictly evaluated with zero ad-hoc handlers.
  - Both demonstrate consistent generalization (conv-48: 65.45% binary, 52.95% F1; conv-42: 65.33% binary, 49.96% F1).
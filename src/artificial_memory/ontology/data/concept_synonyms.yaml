# Concept synonym expansion table (entity-agnostic English concept clusters).
#
# Derived during retrieval tuning against conversational-memory corpora
# (LongMemEval / LoCoMo development splits). Entries clustering specific
# fictional benchmark characters, book titles, or benchmark-internal proper
# nouns are explicitly keyworded so they can be audited / pruned per-corpus.
_meta:
  origin: benchmark_tuned
  description: >
    Concept -> lexical expansion lists used by UniversalEvidenceScorer,
    entity_aggregator, coverage_selector, per_session_sampler and
    budgeted_compiler. Provenance: retrieval-tuning sweeps on the LongMemEval
    and LoCoMo development splits; scored against held-out splits (see
    benchmark_config/holdout.yaml). Gathered here so the runtime ships with
    declared, auditable tuning data instead of silent hardcoding.
  version: 1


# Domain synonym clusters for aggregation topic anchoring.
#
# Usage site: StateReconstructor aggregation second-pass (DOMAIN_SYNONYMS).
# Provenance: LongMemEval aggregation sweep clusters - lexical closes that
# were repeatedly needed to bind query topics ("fish", "property", "citrus")
# onto evidence turns holding the concrete vocabulary ("tetra", "condo").
# These clusters are word-level *synonym neighborhoods*, not answers.
_meta:
  origin: benchmark_tuned
  description: Aggregation topic synonym clusters for social/knowledge/property domains.
  version: 1

